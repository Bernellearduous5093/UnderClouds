name: under_clouds
description: 拍摄白云，识别云的种类，估算距离，发现云下的世界。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.0+1
  tflite_flutter: ^0.12.0
  image: ^4.8.0
  geolocator: ^14.0.2
  sensors_plus: ^7.0.0
  flutter_compass: ^0.8.1
  http: ^1.6.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.0
  google_mobile_ads: ^5.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/cloud_classifier.tflite
    - assets/models/cloud_labels.txt
